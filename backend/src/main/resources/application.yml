spring:
  application:
    name: ycywapi
  config:
    import: "./env.properties"
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: "${MAIN_APP_PORT}"

security:
  jwt:
    secret-key: "${JWT_SECRET_TOKEN}"
    expiration-minutes: 60

logging:
  level:
    root: DEBUG
    com.example: TRACE
