services:
  postgres:
    image: postgres:15
    container_name: ycyw-poc-db
    env_file: .env
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5532:5432'
    volumes:
      - ycyw_poc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ycyw-poc-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - '8050:8080'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ycyw-poc-frontend
    ports:
      - '4250:4200'
    depends_on:
      - backend
    volumes:
      - frontend_node_modules:/app/node_modules

volumes:
  ycyw_poc_db_data:
  frontend_node_modules:
