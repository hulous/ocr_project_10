services:
  postgres:
    image: postgres:15
    container_name: ycyw-poc-db
    env_file: .env
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5532:5432'
    volumes:
      - ycyw_poc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ycyw-poc-backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      FRONTEND_ORIGIN: '${FRONTEND_ORIGIN}'
    ports:
      - '8050:8050'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ycyw-poc-frontend
    ports:
      - '4250:4200'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:4200').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 30s

  e2e:
    profiles: ['e2e']
    build:
      context: ./e2e
      dockerfile: Dockerfile
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      BASE_URL: http://frontend:4200

volumes:
  ycyw_poc_db_data:
