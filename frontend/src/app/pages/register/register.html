<section class="register-page" aria-labelledby="register-title">
  <div class="register-intro">
    <p class="eyebrow">Your Car Your Way</p>
    <h2 id="register-title">Créez votre espace client.</h2>
    <p>Inscrivez-vous pour échanger simplement avec notre équipe support.</p>
  </div>

  <form class="register-form" (ngSubmit)="submit()" #registerForm="ngForm" novalidate>
    <div class="field-group">
      <label for="name">Nom</label>
      <input id="name" name="name" type="text" autocomplete="name" [(ngModel)]="name" required />
    </div>

    <div class="field-group">
      <label for="register-email">Adresse email</label>
      <input
        id="register-email"
        name="email"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        required
        email
        #emailField="ngModel"
        [attr.aria-invalid]="emailField.invalid && emailField.touched"
      />
      <small *ngIf="emailField.invalid && emailField.touched">Saisissez une adresse email valide.</small>
    </div>

    <div class="field-group">
      <label for="register-password">Mot de passe</label>
      <input
        id="register-password"
        name="password"
        type="password"
        autocomplete="new-password"
        [(ngModel)]="password"
        required
        minlength="8"
      />
      <small>8 caractères minimum.</small>
    </div>

    <p *ngIf="errorMessage" class="form-error" role="alert">{{ errorMessage }}</p>

    <button type="submit" [disabled]="registerForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Création...' : 'Créer mon compte' }}
    </button>
    <p class="login-link">Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>
  </form>
</section>
