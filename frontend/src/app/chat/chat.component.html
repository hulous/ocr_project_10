<section aria-labelledby="chat-title">
  <h1 id="chat-title">Tchat</h1>

  <div
    class="chat-window"
    role="log"
    aria-live="polite"
    aria-label="Messages du tchat"
    tabindex="0"
  >
    @if (messages().length) {
      @for (message of messages(); track message) {
        <article class="chat-message">
          <strong>{{ message.author }}</strong>
          <time [attr.datetime]="message.datetime">{{
            message.timestamp
          }}</time>
          <p>{{ message.text }}</p>
        </article>
      }
    } @else {
      <p>Aucun message pour l'instant. Envoyez le premier message.</p>
    }
  </div>

  <form class="chat-form" (ngSubmit)="sendMessage()">
    <label for="messageInput">Message</label>
    <textarea
      id="messageInput"
      name="message"
      rows="3"
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      (keydown.enter)="handleEnterKey($event)"
      required
      aria-required="true"
      autofocus
      placeholder="Tapez votre message ici"
    ></textarea>

    <button type="submit" [disabled]="!draft().trim()">Envoyer</button>
  </form>
</section>
