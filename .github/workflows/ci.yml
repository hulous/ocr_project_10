name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build and verify backend
        working-directory: backend
        run: mvn -q verify

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
      - name: Run frontend build
        working-directory: frontend
        run: npm run build
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure test environment
        run: |
          printf '%s\n' \
            'POSTGRES_DB=ycyw_chat_app' \
            'POSTGRES_HOST=postgres' \
            'POSTGRES_PORT=5432' \
            'POSTGRES_USER=ycyw' \
            'POSTGRES_PASSWORD=ci-password' \
            'JWT_SECRET_TOKEN=ci-only-test-secret-that-is-long-enough' \
            'MAIN_APP_PORT=8050' \
            'FRONTEND_ORIGIN=http://localhost:4250' > .env
      - name: Run end-to-end tests
        run: make test-e2e
