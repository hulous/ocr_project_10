name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 24
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '24'
      - name: Cache Maven local repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build and verify backend
        working-directory: backend
        run: mvn -q verify

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Cache npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Install Chrome
        run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run frontend build
        working-directory: frontend
        run: npm run build
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

  e2e:
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
      POSTGRES_HOST: ${{ vars.CI_POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.CI_POSTGRES_PORT }}
      POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      JWT_SECRET_TOKEN: ${{ secrets.CI_JWT_SECRET_TOKEN }}
      MAIN_APP_PORT: ${{ vars.CI_MAIN_APP_PORT }}
      FRONTEND_ORIGIN: ${{ vars.CI_FRONTEND_ORIGIN }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure test environment
        run: |
          printf '%s\n' \
            "POSTGRES_DB=$POSTGRES_DB" \
            "POSTGRES_HOST=$POSTGRES_HOST" \
            "POSTGRES_PORT=$POSTGRES_PORT" \
            "POSTGRES_USER=$POSTGRES_USER" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "JWT_SECRET_TOKEN=$JWT_SECRET_TOKEN" \
            "MAIN_APP_PORT=$MAIN_APP_PORT" \
            "FRONTEND_ORIGIN=$FRONTEND_ORIGIN" > .env
      - name: Run end-to-end tests
        run: make test-e2e
